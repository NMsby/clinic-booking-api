name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinic_admin
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: clinic_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic_admin -d clinic_booking"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://clinic_admin:ci_test_password@localhost:5432/clinic_booking

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest tests/ -v
